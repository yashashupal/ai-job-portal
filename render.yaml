# Render Blueprint: creates the API (web service) and a Postgres database.
databases:
  - name: hirelane-db
    plan: free
    databaseName: hirelane

services:
  - type: web
    name: hirelane-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /api/jobs/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hirelane-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JOBSPIPE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
